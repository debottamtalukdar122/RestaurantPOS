<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Restaurant POS</title>

    <link rel="stylesheet"
        href="../css/login.css">

</head>

<body>

    <div id="main">

        <div id="container">

            <!-- Logo -->
            <img
                src="../images/logo.png"
                alt="Restaurant POS Logo"
            >


            <!-- Heading -->
            <div id="elem">

                <h1>Forgot Password?</h1>

                <p>
                    Enter your email address and we will
                    help you reset your password.
                </p>

            </div>


            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm">

                <div id="box1">

                    <p>Email</p>

                    <div id="input-username">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    id="forgotPasswordBtn"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- Back to Login -->
            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script
        src="https://kit.fontawesome.com/YOUR_KIT_ID.js"
        crossorigin="anonymous">
    </script>

    <script src="../js/auth.js"></script>

</body>

</html>
