<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Restaurant POS</title>

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

</head>


<body>

    <div id="main">

        <div id="container">

            <!-- Logo -->
            <img
                src="../images/logo.png"
                alt="Restaurant POS Logo"
            >


            <!-- Heading -->
            <div id="elem">

                <h1>Reset Password</h1>

                <p>
                    Enter your new password below.
                </p>

            </div>


            <!-- Reset Form -->
            <form id="resetPasswordForm">

                <div id="box1">

                    <p>New Password</p>

                    <div id="input-password">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                    </div>

                </div>


                <div id="box2">

                    <p>Confirm Password</p>

                    <div id="input-password">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    id="resetPasswordBtn"
                >
                    Reset Password
                </button>

            </form>


            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="../js/auth.js"></script>

</body>

</html>
