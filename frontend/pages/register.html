<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Restaurant POS</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <!-- Logo -->
            <img
                src="../images/logo.png"
                alt="Restaurant POS Logo"
                class="logo"
            >

            <!-- Heading -->
            <h1>Create Account</h1>

            <p class="subtitle">
                Create your Restaurant POS account
            </p>


            <!-- Register Form -->
            <form id="registerForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    id="registerBtn"
                >
                    Create Account
                </button>

            </form>


            <!-- Login link -->
            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- Your authentication JS -->
    <script src="../js/auth.js"></script>

  

</body>

</html>
