<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu | Restaurant</title>


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Customer Menu CSS -->

    <link
        rel="stylesheet"
        href="../../css/customer-menu.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="customer-header">

        <div class="restaurant-info">

            <h1>
                <i class="fa-solid fa-utensils"></i>
                Our Menu
            </h1>

            <p>
                Choose your favourite food
            </p>

        </div>


        <button
            class="cart-btn"
            id="cartBtn"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            Cart

            <span id="cartCount">
                0
            </span>

        </button>

    </header>



    <!-- =========================================
         TABLE INFORMATION
    ========================================== -->

    <section class="table-info">

        <i class="fa-solid fa-table"></i>

        <span>
            Table:
        </span>

        <strong id="tableNumber">
            Loading...
        </strong>

    </section>



    <!-- =========================================
         SEARCH
    ========================================== -->

    <section class="menu-tools">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchMenu"
                placeholder="Search food..."
            >

        </div>


        <div
            class="category-filter"
            id="categoryFilter"
        >

            <button
                class="category-btn active"
                data-category="all"
            >
                All
            </button>

        </div>

    </section>



    <!-- =========================================
         MENU
    ========================================== -->

    <main>

        <div
            class="menu-grid"
            id="menuGrid"
        >

            <!-- JavaScript will add menu cards here -->

        </div>


        <!-- Loading -->

        <div
            class="loading"
            id="loading"
        >

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>
                Loading menu...
            </p>

        </div>


        <!-- Empty -->

        <div
            class="empty-state"
            id="emptyState"
        >

            <i class="fa-solid fa-utensils"></i>

            <h2>
                No Food Found
            </h2>

            <p>
                Try another search or category.
            </p>

        </div>

    </main>



    <!-- =========================================
         CART BAR
    ========================================== -->

    <div
        class="cart-bar"
        id="cartBar"
    >

        <div>

            <span id="cartItemsText">
                0 items
            </span>

            <strong id="cartTotal">
                ₹0
            </strong>

        </div>


        <button id="viewCartBtn">

            View Cart

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>



    <script src="../../js/customer/menu.js"></script>

</body>

</html>
